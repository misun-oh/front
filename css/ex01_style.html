<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{background-color: dimgray; color: #fff;}
        /* 브라우져의 기본 스타일을 제거 하고 싶을때 주로 사용 */
        /* 
        선택자 {스타일속성:속성값;....}
        */

        *{margin: 10px;}
        /* 클래스를 이용한 선택자 
        .클래스이름 클래스를 먼저 등록후 요소의 class속성에 값으로 사용
        */
        .wt{font-weight: 900;}
        .bg-b{background-color: black;}
        .ft-w{color: #fff;}
        .ml10{margin-left: 10px;}
        .pl10{padding-left: 10px;}

        .title{
            color: #fff;
            background-color: black;
            padding-left: 10px;
            font-weight: 900;
            /* solid : 실선, dashed : 점선 */
            border: 2px dashed;
        }

        #p01{background-color: aqua;}
    </style>
    <!-- link태그를 이용해서 미리 만들어 놓은 외부 스타일시트 파일을 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">title</h1>
    <h1 class="bg-b ft-w ml10 pl10">CSS</h1>
    <h3>사용자 정의 스타일</h3>
    <p>1. 인라인 스타일</p>
    태그에 직접 스타일속성을 이용해서 스타일을 지정
    <input type="text" name="" id="" style="width: 10px;">

    <p class="wt">2. 내부 스타일</p>
    웹 문서 상단에 <style></style>태그안에 스타일을 정의

    <p>3. 외부 스타일</p>
    link태그를 이용해서 미리 만들어 놓은 외부 스타일시트 파일을 연결

    <hr>

    <h3>선택자</h3>
    <p>*</p>
    전체 선택자
    <p>타입선택자</p>
    태그를 이용해 요소를 선택
    <p>class 선택자</p>
    class이름으로 스타일을 지정후 필요한 부분에서 가져다 사용 할 수 있다
    <p id="p01">id 선택자</p>
    요소의 특정 부분에만 스타일을 적용

</body>
</html>
