<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        /* 테두리까지 포함해서 너비값으로 지정 */
        box-sizing: border-box;
      }
      #container {
        width: 600px;
        border: 1px solid #ccc;
        font-family: "맑은 고딕" 고딕 궁서;
        margin: 0 auto;
        box-shadow: 10px 10px 100px 5px rgb(73, 73, 73);
        /* 값이 4개 들어갔을때 순서 위 오른쪽 아래 왼쪽 */
        padding: 10px 20px 30px 40px;

        border: 1px solid red;
        border-style: double;
        border-color: blue;
        border-width: 2px;
        border-radius: 100px;
      }
      h1 {
        font-size: 1rem;
        background-color: black;
        color: white;
        padding: 10px;
        margin: 0px;
      }
      h2 {
        color: red;
        text-align: center;
        font-size: 1.4rem;
      }
      p {
        font-size: 1.2rem;
        font-weight: 600;
        text-align: center;
        line-height: 30px;
      }
      .accent {
        color: blue;
      }
      .smalltext {
        font-size: 1rem;
      }

      #container img {
        width: 100%;
        margin-top: 50px;
        border-top-left-radius: 100px;
        border-top-right-radius: 100px;
        border-bottom-right-radius: 100px;
        border-end-end-radius: 100px;
      }

      #bear {
        border-radius: 100%;
        box-shadow: 5px 5px 10px 5px #333;
        border: 20px dotted rgb(110, 25, 25);
      }
    </style>
  </head>
  <body>
    <img id="bear" src="/img/bear.png" alt="" />

    <hr />
    <div id="container">
      <img src="/img/orange.png" alt="오렌지" />

      <div id="check">
        <h1>확인하세요</h1>
        <h2>주문 및 배송</h2>
        <p>
          <span class="accent">오후 2시 이전</span> 주문건은 당일 발송합니다<br />
          2시 이후 주문건은 다음날 발송합니다(주말 제외)
        </p>
        <hr />
        <h2>교환 및 환불</h2>
        <p>
          불만족시 <span class="accent">100% 환불</span>해 드립니다<br />
          고객센터로 전화주세요
        </p>
        <hr />
        <h2>고객센터</h2>
        <p>
          0000-0000<br />
          <span class="smalltext"
            >상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span
          >
        </p>
      </div>
    </div>
  </body>
</html>
