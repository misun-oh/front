<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>입력양식</h1>
    <!-- 서버에 데이터를 전달 하기 -->
    <!-- 1. form태그 안에 입력양식을 작성 -->
    <!-- 2. 입력태그의 name에 서버에 전달할 이름을 작성-->
    <!-- tab : 들여쓰기, shift + tab : 백탭 -->
    <!-- value : 화면에 출력되는 내용 - 서버에 넘어가는 값, name : 서버에 전달되는 이름-->
    <form action="">
    
        <label>아이디 <input type="text" name="id" id="userId" value="abc"></label>
        <label for="userPw">비밀번호</label> <input type="password" name="pw" id="userPw">
        <input type="submit" value="전송">

    </form>

    <hr>

    <!-- placeholder : 입력 힌트 - value속성의 값이 없을때만 보여집니다. -->
    <input type="text" name="" id="" placeholder="아이디를 입력해주세요!" value="abc">
    <input type="text" name="" id="" placeholder="000-000-000">

    <hr>
    <!--요소가 속해있는 form을 기준으로 폼을 전송하거나 초기화 할수 있다!-->
    <form action="">

        <input type="text" name="" id="">
        <input type="submit" value="전송(요청)"> <!-- 서버에 요청(전송) -->
        <input type="reset" value="초기화">  <!-- 입력요소의 값을 초기화 -->
        <input type="button" value="일반버튼"> <!-- 자바스크립트가 요소를 선택해서 이벤트를 추가삭제-->

    </form>

    <hr>

    <h3>체크박스와 라디오버튼</h3>
    <input type="radio" name="" id="">라디오버튼은 여러항목중 한개를 선택 할 수 있다<br>
    <input type="checkbox" name="" id="">체크박스는 여러항목중 여러개를 선택 할 수 있다
    
    <!--체크된 값만 서버로 전달된다-->
    <form action="">
        <fieldset>
            <legend>취미</legend>
            <input type="checkbox" name="hobby" id="" value="1">축구
            <input type="checkbox" name="hobby" id="" value="2">야구
            <input type="checkbox" name="hobby" id="" value="3">농구
            <input type="checkbox" name="hobby" id="" value="4">배구
            <input type="checkbox" name="hobby" id="" value="5">배드민턴

        </fieldset>
        <fieldset>
            <legend>성별</legend>
            <input type="radio" name="gender" id="" value="m">남
            <input type="radio" name="gender" id="" value="f">여

        </fieldset>

        <input type="color" name="color" id=""><br>
        <input type="date" name="date" id="">
        <input type="time" name="time" id=""><br>
        <input type="datetime-local" name="datetime" id=""><br><br>
        <textarea name="textarea" id="" rows="5" cols="100"></textarea>

        <br><input type="submit" value="체크박스 라디오버튼 전송">

        <input type="text" name="" id="">
        
    </form>

</body>
</html>
